<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="t">
<title id="t">Printed PL laminated pouch and flat bag with a diagram of the laminated film layers</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f8f8"/><stop offset="1" stop-color="#e9eeec"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#16603c"/><stop offset=".45" stop-color="#23915a"/><stop offset="1" stop-color="#155a39"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b3a5c"/><stop offset=".5" stop-color="#2d5f93"/><stop offset="1" stop-color="#1b3a5c"/></linearGradient>
<linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9edf0"/><stop offset=".5" stop-color="#b9c2c9"/><stop offset="1" stop-color="#eef1f3"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="sh" x="-50%" y="-400%" width="200%" height="900%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1536" height="1024" fill="url(#bg)"/>
<ellipse cx="400" cy="870" rx="230" ry="22" fill="#1c2b28" opacity=".16" filter="url(#sh)"/>
<ellipse cx="760" cy="870" rx="170" ry="18" fill="#1c2b28" opacity=".14" filter="url(#sh)"/>
<!-- Stand-up laminated pouch -->
<g>
<path d="M200 170 H600 V770 Q600 860 540 860 H260 Q200 860 200 770 Z" fill="url(#green)"/>
<rect x="200" y="170" width="400" height="34" fill="#0f4a2d"/>
<path d="M200 170 v34 M600 170 v34" stroke="#0c3b24" stroke-width="2"/>
<line x1="200" y1="240" x2="600" y2="240" stroke="#0f4a2d" stroke-width="6"/>
<line x1="200" y1="252" x2="600" y2="252" stroke="#0f4a2d" stroke-width="2"/>
<path d="M200 790 Q400 830 600 790" stroke="#0f4a2d" stroke-width="3" fill="none"/>
<rect x="250" y="360" width="300" height="220" rx="14" fill="#fff"/>
<rect x="250" y="360" width="300" height="220" rx="14" fill="none" stroke="#dbe5e0" stroke-width="2" stroke-dasharray="10 8"/>
<text x="400" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f7a4d">YOUR BRAND</text>
<text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="2" fill="#6b7f78">PRINTED ARTWORK</text>
<rect x="290" y="640" width="220" height="12" rx="6" fill="#fff" opacity=".55"/>
<rect x="320" y="668" width="160" height="10" rx="5" fill="#fff" opacity=".4"/>
<rect x="230" y="170" width="120" height="690" fill="url(#gloss)" opacity=".7"/>
<circle cx="582" cy="222" r="0"/>
<path d="M600 205 l-14 8 14 8" fill="#e9eeec"/>
</g>
<!-- Flat laminated bag showing foil inner layer -->
<g>
<rect x="640" y="330" width="250" height="530" rx="4" fill="url(#blue)"/>
<path d="M640 330 H890 V400 L860 380 L830 400 L800 380 L770 400 L740 380 L710 400 L680 380 L640 400 Z" fill="url(#foil)"/>
<path d="M640 400 L680 380 L710 400 L740 380 L770 400 L800 380 L830 400 L860 380 L890 400" fill="none" stroke="#12304e" stroke-width="2"/>
<rect x="640" y="330" width="250" height="16" fill="#9aa7b1"/>
<rect x="672" y="470" width="186" height="120" rx="10" fill="#fff" opacity=".92"/>
<text x="765" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#2d5f93">LOGO</text>
<rect x="690" y="640" width="150" height="10" rx="5" fill="#fff" opacity=".5"/>
<rect x="710" y="664" width="110" height="8" rx="4" fill="#fff" opacity=".35"/>
<rect x="660" y="330" width="70" height="530" fill="url(#gloss)" opacity=".6"/>
<path d="M640 846 H890" stroke="#12304e" stroke-width="4"/>
</g>
<!-- Layer diagram -->
<g font-family="Arial, sans-serif">
<text x="1000" y="250" font-size="30" font-weight="700" fill="#23413a">Laminated film layers</text>
<text x="1000" y="284" font-size="20" fill="#5c6f6a">Two or more films bonded together</text>
<g transform="translate(1000 330)">
<path d="M0 30 L60 0 H400 L340 30 Z" fill="#dff1e7" stroke="#1f7a4d" stroke-width="2"/>
<path d="M0 30 H340 V44 H0 Z" fill="#bfe3cf"/>
<path d="M0 100 L60 70 H400 L340 100 Z" fill="#2d5f93"/>
<path d="M0 100 H340 V110 H0 Z" fill="#1b3a5c"/>
<path d="M0 166 L60 136 H400 L340 166 Z" fill="#f3e3b0"/>
<path d="M0 166 H340 V174 H0 Z" fill="#dcc88e"/>
<path d="M0 236 L60 206 H400 L340 236 Z" fill="url(#foil)" stroke="#aab4bb" stroke-width="2"/>
<path d="M0 236 H340 V252 H0 Z" fill="#aab4bb"/>
</g>
<g font-size="20" fill="#23413a">
<text x="1000" y="620" font-weight="700">1  Outer film</text><text x="1150" y="620" fill="#5c6f6a">gloss / matte finish</text>
<text x="1000" y="656" font-weight="700">2  Print</text><text x="1150" y="656" fill="#5c6f6a">reverse-printed artwork</text>
<text x="1000" y="692" font-weight="700">3  Adhesive</text><text x="1150" y="692" fill="#5c6f6a">bonds the layers</text>
<text x="1000" y="728" font-weight="700">4  Inner film</text><text x="1150" y="728" fill="#5c6f6a">heat-sealable PE / foil</text>
</g>
</g>
<g font-family="Arial, sans-serif" fill="#23413a">
<circle cx="200" cy="246" r="6" fill="#1f7a4d"/><path d="M194 246 H90" stroke="#1f7a4d" stroke-width="2"/>
<text x="40" y="200" font-size="22" font-weight="700">Zip lock</text>
<text x="40" y="226" font-size="18" fill="#5c6f6a">optional</text>
</g>
</svg>
